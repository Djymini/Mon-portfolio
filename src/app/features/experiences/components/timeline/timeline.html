<p-timeline [value]="experienceItems()" align="alternate" class="customized-timeline">
    <ng-template #marker let-event>
        <span class="flex w-8 h-8 items-center justify-center text-white rounded-full z-10 shadow-sm" [style]="{ 'background-color': '#005cb3' }">
            <i [class]="'pi pi-code'"></i>
        </span>
    </ng-template>
    <ng-template #content let-event>
        <p-card [header]="event.title" [subheader]="event.date">
          <p class="location">{{event.location}}</p>
            <p>
                {{event.description}}
            </p>
        </p-card>
    </ng-template>
</p-timeline>
